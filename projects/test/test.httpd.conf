
    ## Settings for BOINC project test

    Alias /test/download /home/navalgan/projects/test/download
    Alias /test/stats /home/navalgan/projects/test/html/stats
    Alias /test/user_profile /home/navalgan/projects/test/html/user_profile
    Alias /test /home/navalgan/projects/test/html/user

    Alias /test_ops /home/navalgan/projects/test/html/ops
    ScriptAlias /test_cgi /home/navalgan/projects/test/cgi-bin

    # In the following, the "denied" and "granted" lines are for Apache 2.4
    # For Apache 2.2, replace them with the lines
    # Order deny,allow
    # Deny from all
    #      or
    # Order allow,deny
    # Allow from all

    # NOTE: Turn off access to certain default directories
    <Directory "/home/navalgan/projects/test/keys">
        Require all denied
    </Directory>
    <Directory "/home/navalgan/projects/test/upload">
        Require all denied
    </Directory>

    # NOTE: Allow access but disable PHP script execution
    <Directory "/home/navalgan/projects/test/download">
        RemoveType .php .phtml
        Require all granted
    </Directory>
    <Directory "/home/navalgan/projects/test/html/stats">
        RemoveType .php .phtml
        Require all granted
    </Directory>
    <Directory "/home/navalgan/projects/test/html/user_profile">
        RemoveType .php .phtml
        Require all granted
    </Directory>

    # NOTE: Allow access and allow PHP script execution
    <Directory "/home/navalgan/projects/test/html">
        Options Indexes MultiViews
        AllowOverride AuthConfig
        Require all granted
    </Directory>

    # NOTE: Allow access and allow CGI execution
    <Directory "/home/navalgan/projects/test/cgi-bin">
        Options ExecCGI
        AllowOverride AuthConfig
        Require all granted
    </Directory>

